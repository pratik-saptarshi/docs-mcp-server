# Dependabot version updates for this fork.
# Fork note: this file lives on `develop` (the fork's default/working branch);
# `main` stays a pristine upstream mirror and carries no fork-only config.
# Security updates are enabled in repo Settings and land as their own PRs —
# they are what propose major bumps when a fix requires one. The grouped
# version updates below cover routine minor/patch freshness only.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types:
          - minor
          - patch
